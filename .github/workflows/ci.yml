name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install uv for Browser Jev tests
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'
          python-version: '3.12'

      - name: Install pinned provider dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix providers/pi-dev ci --omit=dev
          npm --prefix providers/terminal ci --omit=dev
          npm --prefix providers/browser ci --omit=dev
          npm --prefix providers/browser-fast ci --omit=dev
          npm --prefix providers/browser-jev ci --omit=dev
          uv sync --frozen --project providers/browser-jev
          npm --prefix providers/local-tools ci --omit=dev
          npm --prefix providers/skill-library ci --omit=dev

      - name: Run portable repository gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-all.sh
