# Connector-only tool policy for WebHarness MCP (external connectors such as Gemini/ChatGPT/Claude).
# Copy to ~/.config/mcp-dev-bridge/connector-policy.yaml (or set BRIDGE_CONNECTOR_POLICY_FILE).
# HTTP websession-adapter traffic (User-Agent: websession-adapter/*) is never filtered.
# Changes hot-reload automatically on the next initialize or tools/list.
#
# Simple global toggle (still supported):
#   connector_write_tools: false
#
# Optional: set log_client_identifiers: true to emit connector_client_identified
# diagnostic records on initialize and tools/list even when clients: is empty and
# default is permissive. (Whenever clients: is non-empty or a policy override is active,
# connector_client_identified is already logged automatically.)
# log_client_identifiers: true
#
# Per-client policy (recommended): keep honest annotations & direct write tools for
# ordinary clients while enabling the read-only transport shim only for specific connectors.
# Matching notes:
#   - Client rules are evaluated top-to-bottom (first match wins); multiple keys inside
#     match: use AND semantics; unknown/misspelled match keys disable the rule (fail closed).
#   - query_client is exact case-insensitive (?client=<value>).
#   - user_agent and client_info are case-insensitive unanchored regexes (invalid regex
#     falls back to substring match). Escape regex metacharacters like ( ) . or match a
#     distinctive token (e.g. "ChatGPT-User"). Use block YAML or quotes for patterns with commas.
#   - Connector policy is client-asserted ergonomics, not an authorization boundary.
default:
  connector_write_tools: true
  compat_annotations: false
  banner: none
  # Optional client RPC budget in seconds (10..300). Commands exceeding (budget - 3s)
  # auto-promote to durable background jobs, and wait hold_seconds clamps to (budget - 5s).
  rpc_budget_seconds: 40

clients:
  # Gemini-only compatibility shim: hide outer write tools & apply compat_annotations
  # (Gemini sends User-Agent: Google, clientInfo.name "Gemini", or ?client=gemini),
  # while ChatGPT, Claude, and other connectors inherit default (direct write tools enabled).
  # Lean batching/just/pueue directives ship natively in tools/list & provider instructions,
  # so banner: none avoids redundant initialize payload bloat.
  gemini:
    match:
      user_agent: "^Google$"
    connector_write_tools: false
    compat_annotations: true
    banner: none
    rpc_budget_seconds: 25

  gemini_query:
    match:
      query_client: gemini
    connector_write_tools: false
    compat_annotations: true
    banner: none
    rpc_budget_seconds: 25

  gemini_info:
    match:
      client_info: "gemini"
    connector_write_tools: false
    compat_annotations: true
    banner: none
    rpc_budget_seconds: 25
